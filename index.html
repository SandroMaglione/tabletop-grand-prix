<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabletop Grand Prix</title>
    <meta name="description" content="A time-attack racer on a toy track. Set the fastest lap, race a field of up to ten ghosts, and climb the leaderboard. Play free in your browser." />
    <meta name="theme-color" content="#141a2e" />
    <link rel="canonical" href="https://tabletop-grand-prix.typeonce.games/" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- The link card: drawn by `scripts/cards.ts`. -->
    <meta property="og:site_name" content="Typeonce Games" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tabletop-grand-prix.typeonce.games/" />
    <meta property="og:title" content="Tabletop Grand Prix" />
    <meta property="og:description" content="A time-attack racer on a toy track. Set the fastest lap, race a field of ghosts, and climb the leaderboard. Play free in your browser." />
    <meta property="og:image" content="https://tabletop-grand-prix.typeonce.games/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A red toy car leading a rainbow trail of ghost cars round a bend of a tabletop race track, beside the title Tabletop Grand Prix." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tabletop Grand Prix" />
    <meta name="twitter:description" content="A time-attack racer on a toy track. Set the fastest lap, race a field of ghosts, and climb the leaderboard." />
    <meta name="twitter:image" content="https://tabletop-grand-prix.typeonce.games/og.png" />
    <meta name="twitter:image:alt" content="A red toy car leading a rainbow trail of ghost cars round a bend of a tabletop race track, beside the title Tabletop Grand Prix." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Chakra+Petch:wght@600;700&display=swap" />
    <style>
      html, body { height: 100%; margin: 0; overflow: hidden; background: #e9e6df; }
      canvas { display: block; }

      /*
       * The loading screen: on screen from the first paint, before the game's script has even
       * arrived, until the game has drawn its first frames (`src/host/loading.ts`). The dark
       * hatched cover of the lap-end wipe, with the Typeonce lockup floating up and down on it.
       * It is wider than the window by its slanted edge, and leaves to the left like the wipe.
       */
      #tgp-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: calc(100vw + 40vh);
        height: 100%;
        z-index: 30;
        background: repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.045) 0 10px, transparent 10px 28px), #141a2e;
        clip-path: polygon(0 0, 100% 0, calc(100% - 40vh) 100%, 0 100%);
        color: #f2f4fa;
        font-family: "Chakra Petch", Eurostile, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 3px;
        transition: transform 460ms cubic-bezier(0.7, 0, 0.75, 0.4);
      }
      #tgp-loading.tgp-loading-out { transform: translateX(-102%); }
      #tgp-loading > div {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
      }
      #tgp-loading svg { display: block; animation: tgp-float 1.7s ease-in-out infinite alternate; }
      #tgp-loading p { margin: 0; height: 1em; color: #b9c1d3; }
      /* "LOADING" with its dots counting one, two, three, two, and round again; the dots keep their room, so the word stays put. */
      #tgp-loading p i { font-style: normal; animation: 1.6s step-end infinite; }
      #tgp-loading p i:nth-of-type(1) { animation: none; }
      #tgp-loading p i:nth-of-type(2) { animation-name: tgp-dot-2; }
      #tgp-loading p i:nth-of-type(3) { animation-name: tgp-dot-3; }
      @keyframes tgp-dot-2 {
        0% { opacity: 0; }
        25% { opacity: 1; }
      }
      @keyframes tgp-dot-3 {
        0% { opacity: 0; }
        50% { opacity: 1; }
        75% { opacity: 0; }
      }
      @keyframes tgp-float {
        from { transform: translateY(-10px); }
        to { transform: translateY(10px); }
      }
      @media (prefers-reduced-motion: reduce) {
        #tgp-loading { transition: opacity 200ms ease; }
        #tgp-loading.tgp-loading-out { transform: none; opacity: 0; }
        #tgp-loading svg { animation: none; }
        #tgp-loading p i { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="tgp-loading" role="status" aria-label="Loading Tabletop Grand Prix">
      <div>
        <!--typeonce-lockup-->
        <p id="tgp-loading-note">LOADING<i>.</i><i>.</i><i>.</i></p>
      </div>
    </div>
    <script>
      // A game that fails before its first frame says so, instead of floating there for good.
      (() => {
        const failed = () => {
          const loading = document.getElementById("tgp-loading")
          const note = document.getElementById("tgp-loading-note")
          if (loading !== null && !loading.classList.contains("tgp-loading-out") && note !== null) note.textContent = "COULD NOT START · RELOAD TO TRY AGAIN"
        }
        window.addEventListener("error", failed)
        window.addEventListener("unhandledrejection", failed)
      })()
    </script>
    <script type="module" src="/src/host/main.ts"></script>
  </body>
</html>
